<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filigrane — plain HTML example</title>
    <!-- One script tag registers <ai-disclosure> and <ai-label>. -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@filigrane/ui@0.1.0/dist/index.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      figure { position: relative; display: inline-block; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Art. 50(1): chatbot disclosure. -->
    <ai-disclosure model="Support assistant" dismissible></ai-disclosure>

    <!-- Art. 50(4): visible label on an AI image (keep it visible when the image is shared). -->
    <figure>
      <img src="cover.jpg" alt="Illustration generated by AI" width="480" />
      <ai-label variant="overlay" model="Image model 3"></ai-label>
    </figure>

    <!-- Labels follow the page language automatically. -->
    <p lang="de">Zusammenfassung <ai-label kind="modified"></ai-label></p>
  </body>
</html>
