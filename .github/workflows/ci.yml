name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  interop:
    name: C2PA interoperability (reference implementation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install c2pa-python
      - run: npm ci
      - run: npm run build
      - run: node scripts/interop.mjs

  self-scan:
    name: Scan the examples with the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node packages/cli/dist/cli.js scan examples --format markdown >> "$GITHUB_STEP_SUMMARY"

  action:
    name: Run the GitHub Action like a user would
    runs-on: ubuntu-latest
    steps:
      # Check out the action in a subfolder: at the root of this repository, npx would
      # resolve "filigrane" to the local workspace instead of the published CLI.
      - uses: actions/checkout@v5
        with:
          path: filigrane-action
      - run: cp -r filigrane-action/examples examples
      - uses: ./filigrane-action
        with:
          path: examples
          fail-on: never
          upload-sarif: 'false'
