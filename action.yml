name: 'Filigrane — AI transparency scan'
description: 'Find EU AI Act Article 50 gaps (chatbot disclosure, AI media marking) and report them in code scanning and job summaries.'
author: 'Alexis Nieto'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  path:
    description: 'Directory to scan.'
    default: '.'
  fail-on:
    description: 'Fail the job on "error" findings (default), on "warning" and above, or "never".'
    default: 'error'
  upload-sarif:
    description: 'Upload results to GitHub code scanning (needs "security-events: write").'
    default: 'true'
  version:
    description: 'Version (or range) of the filigrane CLI to run from npm.'
    default: '0'

runs:
  using: 'composite'
  steps:
    # Only install Node.js when the runner lacks Node 20+, so the job keeps its own Node version.
    - id: node
      shell: bash
      run: |
        if command -v node >/dev/null && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 20 ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - if: ${{ steps.node.outputs.ok != 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Scan
      shell: bash
      env:
        FG_PATH: ${{ inputs.path }}
        FG_VERSION: ${{ inputs.version }}
        FG_FAIL_ON: ${{ inputs.fail-on }}
        FG_OUT: ${{ runner.temp }}/filigrane
      run: |
        mkdir -p "$FG_OUT"
        npx --yes "filigrane@${FG_VERSION}" scan "$FG_PATH" --format sarif --output "$FG_OUT/filigrane.sarif" --fail-on never
        npx --yes "filigrane@${FG_VERSION}" scan "$FG_PATH" --format markdown --output "$FG_OUT/report.md" --fail-on "$FG_FAIL_ON" && status=0 || status=$?
        cat "$FG_OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
        echo "status=$status" > "$FG_OUT/status"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/filigrane/filigrane.sarif
        category: filigrane

    - name: Enforce
      shell: bash
      env:
        FG_OUT: ${{ runner.temp }}/filigrane
      run: |
        status=$(sed -n 's/^status=//p' "$FG_OUT/status")
        if [ "$status" != "0" ]; then
          echo "::error::Filigrane found AI transparency issues (see the job summary)."
          exit 1
        fi
